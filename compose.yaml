name: creativeos
x-app: &app
  image: creativeos-backend:local
  build: ./backend
  environment: &app-env
    APP_ENV: development
    AGENCY_TIMEZONE: ${AGENCY_TIMEZONE:-Asia/Jakarta}
    AI_PROVIDER: ${AI_PROVIDER:-fixture}
    AI_MODEL: ${AI_MODEL:-fixture-v1}
    AI_ENDPOINT: ${AI_ENDPOINT:-}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2000}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
    WEBHOOK_KEY: ${WEBHOOK_KEY:?run scripts/init_env.py}
    WORKFLOW_KEY: ${WORKFLOW_KEY:?run scripts/init_env.py}
    FORMS_KEY: ${FORMS_KEY:?run scripts/init_env.py}
    WEB_ORIGIN: http://localhost:${WEB_PORT:-3100}
    APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run scripts/init_env.py}

services:
  postgres:
    image: postgres:16-bookworm@sha256:ce3efec6bc404f6b15ebf5d9bed6b45a9d4655aea238d7dacc3467ccb05a1175
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init_env.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run scripts/init_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-creative.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "creativeos"]
      interval: 5s
      timeout: 4s
      retries: 15
  migrate:
    <<: *app
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  backend:
    <<: *app
    environment:
      <<: *app-env
      FILE_PROVIDER: ${FILE_PROVIDER:-local}
      DRIVE_ACCESS_TOKEN: ${DRIVE_ACCESS_TOKEN:-}
    volumes: ["creative_files:/home/creative/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${API_PORT:-8100}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 10
  backend-test:
    <<: *app
    profiles: ["test"]
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      n8n: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/creativeos-worker-heartbeat').st_mtime < 20"]
      interval: 8s
      timeout: 4s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1))"]
      interval: 8s
      timeout: 5s
      retries: 10
  n8n:
    entrypoint: ["tini", "--", "/bin/sh", "/creative/bootstrap.sh"]
    image: n8nio/n8n:2.48.6@sha256:eafe48609be09a2d56dd3628b29932a12c2e81a06ac5a309205652ea36146619
    ports: ["127.0.0.1:${N8N_PORT:-5679}:5678"]
    environment:
      WEBHOOK_KEY: ${WEBHOOK_KEY:?run scripts/init_env.py}
      WORKFLOW_KEY: ${WORKFLOW_KEY:?run scripts/init_env.py}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run scripts/init_env.py}
      GENERIC_TIMEZONE: ${AGENCY_TIMEZONE:-Asia/Jakarta}
      REMINDER_CRON: ${REMINDER_CRON:-* * * * *}
      TZ: ${AGENCY_TIMEZONE:-Asia/Jakarta}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - ./automation/n8n:/creative:ro
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "/creative/ready.cjs"]
      interval: 8s
      timeout: 6s
      start_period: 10m
      retries: 25
volumes:
  creative_files:
  postgres_data:
  n8n_data:
