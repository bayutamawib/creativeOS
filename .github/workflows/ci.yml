name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_specs.py
      - run: npm ci && npm run lint && npm run typecheck && npm test
        working-directory: frontend
      - run: python3 scripts/init_env.py && docker compose up -d --build --wait
      - run: sh scripts/test_backend.sh
      - run: python3 scripts/smoke.py
      - run: python3 scripts/seed_local.py
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
